<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
<a-scene background="color: #061A3A">

  <a-plane rotation="-90 0 0" width="500" height="500" color="#333"></a-plane>
  <a-sky color="#061A3A" radius="500"></a-sky>
    <a-entity light="type: ambient; color: #BBB"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="1 2 1"></a-entity>
    <a-entity light="type: point; color: #FFD27A; intensity: 1.2; distance: 12; decay: 2" position="-8 4 -8">
      <a-animation attribute="light.intensity" from="0.25" to="1.2" dur="1800" direction="alternate" repeat="indefinite"></a-animation>
    </a-entity>
    <a-entity light="type: point; color: #FFD27A; intensity: 1.2; distance: 12; decay: 2" position="8 4 -8">
      <a-animation attribute="light.intensity" from="0.25" to="1.2" dur="2200" direction="alternate" repeat="indefinite" delay="500"></a-animation>
    </a-entity>
    <a-entity light="type: point; color: #FFD27A; intensity: 1.2; distance: 12; decay: 2" position="8 4 8">
      <a-animation attribute="light.intensity" from="0.25" to="1.2" dur="2000" direction="alternate" repeat="indefinite" delay="900"></a-animation>
    </a-entity>
    <a-entity light="type: point; color: #FFD27A; intensity: 1.2; distance: 12; decay: 2" position="-8 4 8">
      <a-animation attribute="light.intensity" from="0.25" to="1.2" dur="2400" direction="alternate" repeat="indefinite" delay="300"></a-animation>
    </a-entity>
  <a-assets>
    <a-asset-item id="room" src="myRoom_v2.glb"></a-asset-item>
  </a-assets>

  <!-- Using the asset management system. -->
  <a-gltf-model src="#room" position="0 0 0"></a-gltf-model>

  <a-camera position="0 25 0"></a-camera>

</a-scene>
  </body>
</html>
